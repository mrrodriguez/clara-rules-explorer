name: UI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Check (Types & Svelte)
        run: pnpm check

      - name: Setup Playwright browsers
        uses: ./.github/actions/setup-playwright

      - name: Unit Tests
        run: pnpm test:unit --run

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1654
          github-token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install

      - name: Setup Playwright browsers
        uses: ./.github/actions/setup-playwright

      - name: Build UI
        working-directory: ui
        run: pnpm build
        env:
          # adapter-node for e2e (SSR on, /v1 proxied to the live backend).
          # Without this, svelte.config.js falls back to @sveltejs/adapter-auto,
          # which detects no platform on GitHub Actions and emits no build/
          # output — so bin/ci/e2e-server.js fails to import build/handler.js.
          E2E_BUILD: 'true'

      - name: Prepare Demo Session
        working-directory: server
        run: clojure -M:demo-setup

      # Backends are started by Playwright's webServer config (one per e2e
      # project: loan-app on 9101, hierarchy on 9201); the loan-app backend
      # consumes the demo session serialized above.  Playwright reuses a
      # backend already listening on the port.
      - name: Run E2E Tests
        working-directory: ui
        run: pnpm test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 30
