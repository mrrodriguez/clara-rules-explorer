---
# selene standard library for the `std = "neovim"` config.  selene bundles the
# Lua base stds (lua51/52/53, luau, roblox) but not the Neovim std, so we
# vendor a minimal one in the working directory (same shape as the astrovim
# dotfiles).  `global_usage = "allow"` in selene.toml means deep `vim.*` field
# checking is not needed here — only the `vim` global name needs to be known.
base: lua51

globals:
  vim:
    any: true
  # plenary.busted test globals (test/clara-explorer/*_spec.lua)
  describe:
    any: true
  it:
    any: true
  pending:
    any: true
  before_each:
    any: true
  after_each:
    any: true
